name: Repair chapter script
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Repair broken chapter script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing chapter object brace
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          broken="</ul>`,3:{title:'Modalverben – können, müssen und Überblick'"
          fixed="</ul>`},3:{title:'Modalverben – können, müssen und Überblick'"
          if broken in s:
              s=s.replace(broken,fixed,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix chapter 3 JavaScript syntax"
          git push
